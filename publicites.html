<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicités | EMPLOI INFO</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c9a227">
<link rel="apple-touch-icon" href="/pwa-icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;min-height:100vh}header{padding:24px 16px;text-align:center;background:#050505;border-bottom:1px solid rgba(255,215,0,.25)}header img{width:56px;height:56px;border-radius:12px;vertical-align:middle;margin-right:10px}header h1{display:inline;color:gold;font-size:24px}.wrap{max-width:1100px;margin:auto;padding:22px 14px}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input{flex:1;padding:12px;border-radius:8px;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#181818;border:1px solid rgba(255,215,0,.22);border-radius:8px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.25)}.card img,.card video{width:100%;height:170px;object-fit:cover;background:#000}.body{padding:14px}.body h2{font-size:17px;color:gold;margin:0 0 8px}.body p{font-size:14px;line-height:1.45;color:#ddd}.meta{font-size:12px;color:#aaa;margin-top:8px}.price{display:inline-flex;gap:8px;align-items:center;margin-top:8px;padding:7px 10px;border-radius:999px;background:rgba(255,215,0,.12);color:gold;font-weight:bold;font-size:13px}.old{text-decoration:line-through;color:#aaa}.tag{display:inline-block;margin-bottom:8px;padding:5px 8px;border-radius:999px;background:#262626;color:#fff;font-size:12px}.btn{display:inline-block;margin:10px 8px 0 0;padding:10px 12px;border-radius:6px;background:gold;color:#111;font-weight:bold;text-decoration:none;border:0;cursor:pointer}.btn.secondary{background:#1e90ff;color:#fff}.empty{text-align:center;color:#bbb;padding:35px}
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/pwa-icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c9a227"></head>
<body>
<header><img src="logo.png" alt="EMPLOI INFO"><h1>Les 20 dernières publicités</h1></header>
<main class="wrap">
  <div class="toolbar"><input id="search" placeholder="Rechercher une publicité"></div>
  <div id="ads" class="grid"><p class="empty">Chargement...</p></div>
</main>
<script src="assets/content-media.js"></script>
<script>
let allAds=[];
function isPublished(ad){const v=ad&&ad.publie;return v===true||v===1||v==="1"||String(v).toLowerCase()==="true"}
function isActive(ad){return isPublished(ad)&&(!ad.expires_at||new Date(ad.expires_at).getTime()>=Date.now())}
function clean(text){return String(text||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim()}
function media(ad){return window.ContentMedia ? ContentMedia.renderFile(ad) : ""}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function formationPrice(f){const type=f.pricing_type||(f.prix?"payant":"gratuit");if(type==="gratuit")return'<div class="price">Gratuit</div>';if(type==="promotion")return`<div class="price">${f.prix_normal?`<span class="old">${esc(f.prix_normal)}</span>`:""}<span>${esc(f.prix_promo||f.prix||"Promotion")}</span></div>`;return`<div class="price">${esc(f.prix||f.prix_normal||"Payant")}</div>`}
function shareFormation(id,title){const url=location.origin+location.pathname.replace("publicites.html","formation-details.html")+"?id="+encodeURIComponent(id);if(navigator.share)navigator.share({title,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>alert("Lien copié"))}
function render(list){
  const root=document.getElementById("ads");
  if(!list.length){root.innerHTML='<p class="empty">Aucune publicité disponible.</p>';return}
  root.innerHTML=list.map(ad=>ad.kind==="formation"?`
    <article class="card">
      ${media(ad)}
      <div class="body">
        <span class="tag">Formation</span>
        <h2>${clean(ad.titre)}</h2>
        ${formationPrice(ad)}
        <p>${clean(ad.texte).slice(0,160)}${clean(ad.texte).length>160?"...":""}</p>
        <div class="meta">${ad.lieu?clean(ad.lieu)+" - ":""}${ad.date_debut?"début le "+new Date(ad.date_debut).toLocaleDateString():""}</div>
        <a class="btn" href="formation-details.html?id=${encodeURIComponent(ad.id)}">Voir détails</a>
        <button class="btn secondary" onclick="shareFormation('${esc(ad.id)}','${esc(ad.titre)}')">Partager</button>
      </div>
    </article>`:`
    <article class="card">
      ${media(ad)}
      <div class="body">
        <span class="tag">Publicité</span>
        <h2>${clean(ad.titre)}</h2>
        <p>${clean(ad.description).slice(0,160)}${clean(ad.description).length>160?"...":""}</p>
        <div class="meta">Publié le ${ad.date?new Date(ad.date).toLocaleDateString():""}${ad.expires_at?" - expire le "+new Date(ad.expires_at).toLocaleDateString():""}</div>
        <a class="btn" href="publicite-details.html?id=${encodeURIComponent(ad.id)}">Voir la publicité</a>
      </div>
    </article>`).join("");
}
fetch("ads.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(data=>{
  const ads=(Array.isArray(data)?data:[]).filter(isActive);
  return fetch("formations.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(forms=>{
    const formations=(Array.isArray(forms)?forms:[]).filter(f=>f.publie!==false).map(f=>({...f,kind:"formation",description:f.texte}));
    allAds=ads.concat(formations).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)).slice(0,40);
    render(allAds);
  });
});
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  render(allAds.filter(ad=>(clean(ad.titre)+" "+clean(ad.description)).toLowerCase().includes(q)));
});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js", {scope: "/"}).catch(()=>{}))}
</script>
<script src="/assets/site-menu.js"></script>
</body>
</html>
