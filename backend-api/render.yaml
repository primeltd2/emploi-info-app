services:
  - type: web
    name: emploi-info-api
    runtime: node
    plan: free
    rootDir: backend-api
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: ..
      - key: APP_ORIGIN
        value: https://emploi-info.page.gd,https://app.local,null
      - key: API_KEY
        value: emploi-info-sync-2026
