plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.emploiinfo.app"
    compileSdk 35

    flavorDimensions "edition"

    defaultConfig {
        applicationId "com.emploiinfo.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildFeatures {
        buildConfig true
    }

    productFlavors {
        publicApp {
            dimension "edition"
            applicationId "com.emploiinfo.app"
            versionCode 5
            versionName "1.4"
            manifestPlaceholders = [appScheme: "emploiinfo"]
            resValue "string", "app_name", "EMPLOI INFO"
            buildConfigField "String", "HOME_URL", "\"https://emploi-info.page.gd/index.html\""
            buildConfigField "String", "API_BASE_URL", "\"https://emploi-info-api.onrender.com/api/v1\""
            buildConfigField "String", "REGISTER_TOKEN_URL", "\"https://emploi-info.page.gd/register_android_token.php\""
            buildConfigField "String", "APP_VERSION_URL", "\"https://emploi-info.page.gd/app_version.json\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://emploi-info.page.gd/download_app.php\""
            buildConfigField "String", "APP_SCHEME", "\"emploiinfo\""
            buildConfigField "String", "USER_AGENT_SUFFIX", "\"EmploiInfoAndroid\""
            buildConfigField "String", "APP_DISPLAY_NAME", "\"EMPLOI INFO\""
            buildConfigField "boolean", "ENABLE_ADS", "true"
        }
        admin {
            dimension "edition"
            applicationId "com.emploiinfo.admin"
            versionCode 3
            versionName "1.2"
            manifestPlaceholders = [appScheme: "adminemploiinfo"]
            resValue "string", "app_name", "ADMIN EMPLOI INFO"
            buildConfigField "String", "HOME_URL", "\"https://emploi-info.page.gd/admin.html\""
            buildConfigField "String", "API_BASE_URL", "\"https://emploi-info-api.onrender.com/api/v1\""
            buildConfigField "String", "REGISTER_TOKEN_URL", "\"https://emploi-info.page.gd/register_android_token.php\""
            buildConfigField "String", "APP_VERSION_URL", "\"https://emploi-info.page.gd/admin_app_version.json\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://emploi-info.page.gd/download_admin_app.php\""
            buildConfigField "String", "APP_SCHEME", "\"adminemploiinfo\""
            buildConfigField "String", "USER_AGENT_SUFFIX", "\"AdminEmploiInfoAndroid\""
            buildConfigField "String", "APP_DISPLAY_NAME", "\"ADMIN EMPLOI INFO\""
            buildConfigField "boolean", "ENABLE_ADS", "false"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.android.gms:play-services-ads:23.6.0"
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.0"
}
