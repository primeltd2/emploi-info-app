plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def readDotEnvValue = { File file, String key ->
    if (!file.exists()) return ""
    def prefix = "${key}="
    def line = file.readLines("UTF-8").find { it.trim().startsWith(prefix) }
    if (!line) return ""
    return line.substring(line.indexOf("=") + 1).trim().replaceAll(/^['"]|['"]$/, "")
}

def adminApiKey = providers.gradleProperty("EMPLOI_INFO_ADMIN_API_KEY")
    .orElse(providers.environmentVariable("EMPLOI_INFO_ADMIN_API_KEY"))
    .orElse(readDotEnvValue(rootProject.projectDir.parentFile.toPath().resolve("backend-api/.env").toFile(), "API_KEY"))
    .get()

android {
    namespace "com.emploiinfo.app"
    compileSdk 35

    flavorDimensions "edition"

    defaultConfig {
        applicationId "com.emploiinfo.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildFeatures {
        buildConfig true
    }

    productFlavors {
        publicApp {
            dimension "edition"
            applicationId "com.emploiinfo.app"
            versionCode 8
            versionName "1.7"
            manifestPlaceholders = [appScheme: "emploiinfo"]
            resValue "string", "app_name", "EMPLOI INFO"
            buildConfigField "String", "HOME_URL", "\"https://app.local/index.html\""
            buildConfigField "String", "API_BASE_URL", "\"https://emploi-info-api.onrender.com/api/v1\""
            buildConfigField "String", "ADMIN_API_KEY", "\"${adminApiKey}\""
            buildConfigField "String", "REGISTER_TOKEN_URL", "\"https://emploi-info-api.onrender.com/api/v1/android/tokens\""
            buildConfigField "String", "APP_VERSION_URL", "\"https://emploi-info-api.onrender.com/api/v1/app-version?kind=public\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://apkpure.com/p/com.emploiinfo.app\""
            buildConfigField "String", "APP_SCHEME", "\"emploiinfo\""
            buildConfigField "String", "USER_AGENT_SUFFIX", "\"EmploiInfoAndroid\""
            buildConfigField "String", "APP_DISPLAY_NAME", "\"EMPLOI INFO\""
            buildConfigField "boolean", "ENABLE_ADS", "true"
            buildConfigField "boolean", "ENABLE_REMOTE_SITE_SERVICES", "true"
            buildConfigField "boolean", "ENABLE_REMOTE_CONTENT_SYNC", "true"
        }
        admin {
            dimension "edition"
            applicationId "com.emploiinfo.admin"
            versionCode 6
            versionName "1.5"
            manifestPlaceholders = [appScheme: "adminemploiinfo"]
            resValue "string", "app_name", "ADMIN EMPLOI INFO"
            buildConfigField "String", "HOME_URL", "\"https://app.local/admin.html\""
            buildConfigField "String", "API_BASE_URL", "\"https://emploi-info-api.onrender.com/api/v1\""
            buildConfigField "String", "ADMIN_API_KEY", "\"${adminApiKey}\""
            buildConfigField "String", "REGISTER_TOKEN_URL", "\"https://emploi-info-api.onrender.com/api/v1/android/tokens\""
            buildConfigField "String", "APP_VERSION_URL", "\"https://emploi-info-api.onrender.com/api/v1/app-version?kind=admin\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://github.com/primeltd2/emploi-info-app/releases/latest/download/admin-emploi-info-autonome.apk\""
            buildConfigField "String", "APP_SCHEME", "\"adminemploiinfo\""
            buildConfigField "String", "USER_AGENT_SUFFIX", "\"AdminEmploiInfoAndroid\""
            buildConfigField "String", "APP_DISPLAY_NAME", "\"ADMIN EMPLOI INFO\""
            buildConfigField "boolean", "ENABLE_ADS", "false"
            buildConfigField "boolean", "ENABLE_REMOTE_SITE_SERVICES", "true"
            buildConfigField "boolean", "ENABLE_REMOTE_CONTENT_SYNC", "true"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.android.gms:play-services-ads:23.6.0"
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.0"
}

def bundledSiteDir = file("$projectDir/src/main/assets/site")
def siteRootDir = rootProject.projectDir.parentFile

tasks.register("copyBundledSite", Copy) {
    from(siteRootDir)
    into(bundledSiteDir)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    include "*.html", "*.json", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.ico", "*.txt", "*.xml", "*.css", "*.js"
    include "assets/**", "images/**", "uploads/**", "favi/**"

    exclude ".git/**", "android-app/**", "backend-api/**", "node_modules/**", "scripts/**", "_backups/**", "downloads/**"
    exclude "*.apk", "*.zip", "*.md", "*.php", "*.bat", "*.properties", ".htaccess"
    exclude "admins.json", "admins.example.json", "users.json", "login_attempts.json"
    exclude "firebase_service_account.json", "smtp_config.php", "smtp_config.example.php"
    exclude "vapid_config.example.php", "android_tokens.json", "android_push_log.json"
    exclude "notification_queue.json", "notification_sent.json", "notification_views.json"
    exclude "push_subscriptions.json", "contact_messages.json", "test_cookie.txt"

    doFirst {
        delete(bundledSiteDir)
    }
}

preBuild.dependsOn("copyBundledSite")
