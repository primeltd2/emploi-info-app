<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const card = document.getElementById("detailCard");
let lastHash="";

// ðŸ”¥ temps Ã©coulÃ© intelligent
function tempsEcoule(dateString){
  if(!dateString) return "";
  const now = new Date();
  const pub = new Date(dateString);
  const diff = Math.floor((now - pub)/1000);
  if(diff < 60) return "PubliÃ© Ã  l'instant";
  if(diff < 3600) return "PubliÃ© il y a " + Math.floor(diff/60) + " minute(s)";
  if(diff < 86400) return "PubliÃ© il y a " + Math.floor(diff/3600) + " heure(s)";
  return "PubliÃ© il y a " + Math.floor(diff/86400) + " jour(s)";
}

// ðŸ”¥ rendu annonce
function renderAnnonce(a){
  const hash = JSON.stringify(a);
  if(hash===lastHash) return;
  lastHash=hash;

  card.innerHTML=`
    ${a.banniere ? `<img src="${a.banniere.startsWith('http') ? a.banniere : 'https://emploi-info.page.gd/' + a.banniere}">` : ""}
    <h2>${a.titre}</h2>
    <p style="color:gold;font-size:14px;">
      ðŸ“… ${new Date(a.date).toLocaleString()}<br>
      â³ ${tempsEcoule(a.date)}
    </p>
    <p>${a.texte}</p>
    ${a.notice ? `<p><i>${a.notice}</i></p>` : ""}
    ${a.boutons ? a.boutons.map(b=>`
      <a class="btn"
      style="background:${b.couleur}"
      href="${b.lien}"
      target="_blank">${b.texte}</a>`).join("") : ""}
    <div class="share-buttons">
      <button id="mainShareBtn" style="background:#1E90FF;">Partager</button>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <a href="index.html" class="btn" style="background:gold;color:black;">Retour Ã  l'accueil</a>
    </div>
  `;

  const mainShareBtn = card.querySelector("#mainShareBtn");
  const sharePopup = document.getElementById("sharePopup");
  const shareOverlay = document.getElementById("shareOverlay");
  const closeShare = document.getElementById("closeShare");

  mainShareBtn.onclick = () => {
    sharePopup.classList.add("show");
    shareOverlay.style.display = "block";
  };

  closeShare.onclick = () => {
    sharePopup.classList.remove("show");
    shareOverlay.style.display = "none";
  };

  shareOverlay.onclick = closeShare;

  // ðŸ”¥ partage des boutons
  document.getElementById("shareFB").onclick = () => { window.open('https://www.facebook.com/sharer/sharer.php?u='+location.href); closeShare.onclick(); };
  document.getElementById("shareWA").onclick = () => { window.open('https://wa.me/?text='+encodeURIComponent(location.href)); closeShare.onclick(); };
  document.getElementById("shareLinkedIn").onclick = () => { window.open('https://www.linkedin.com/shareArticle?url='+encodeURIComponent(location.href)); closeShare.onclick(); };
  document.getElementById("shareTwitter").onclick = () => { window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)); closeShare.onclick(); };
  document.getElementById("copyLink").onclick = () => { navigator.clipboard.writeText(location.href).then(()=>alert("Lien copiÃ© !")); closeShare.onclick(); };
}

// ðŸ”¥ rendu offres rÃ©centes
function renderRecentOffers(offers){
  const container = document.getElementById("offersList");
  if(offers.length === 0){
    container.innerHTML = "<p>Aucune autre offre disponible</p>";
    return;
  }
  
  container.innerHTML = offers.map(a => `
    <div class="recent-item" onclick="location.href='details.html?id=${a.id}'">
      ${a.banniere ? `<img src="${a.banniere}">` : ""}
      <h4>${a.titre}</h4>
      <p>${a.texte.substring(0,50)}...</p>
    </div>
  `).join("");
}

// ðŸ”¥ rendu publicitÃ©s rÃ©centes
function renderRecentAds(ads){
  const container = document.getElementById("adsList");
  if(ads.length === 0){
    container.innerHTML = "<p>Aucune publicitÃ© disponible</p>";
    return;
  }
  
  container.innerHTML = ads.map(ad => `
    <div class="recent-item" onclick="location.href='publicite-details.html?id=${ad.id}'">
      ${ad.fichier ? (ad.fichier.includes('.mp4') || ad.fichier.includes('.webm') ? 
        `<video style="width:100%;height:100px;object-fit:cover;border-radius:5px;"><source src="${ad.fichier}"></video>` : 
        `<img src="${ad.fichier}">`) : ""}
      <h4>${ad.titre}</h4>
      <p>${ad.description.substring(0,50)}...</p>
    </div>
  `).join("");
}

// ðŸ”¥ anti-cache + refresh
function loadData(){
  fetch("data.json?ts="+Date.now(),{cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{
    const annonce = data.find(a=>a.id==id && a.publie);
    if(annonce) renderAnnonce(annonce);
    
    // Charger offres rÃ©centes (exclure l'actuelle)
    const recentOffers = data.filter(a=>a.id != id && a.publie).slice(-5).reverse();
    renderRecentOffers(recentOffers);
  })
  .catch(e=>console.log("Erreur data.json",e));
  
  // Charger publicitÃ©s
  fetch("ads.json?ts="+Date.now(),{cache:"no-store"})
  .then(r=>r.json())
  .then(ads=>{
    renderRecentAds(ads.slice(-5));
  })
  .catch(e=>console.log("Erreur ads.json",e));
}

loadData();
setInterval(loadData,5000);

// ðŸ”¥ carte NB flottante
const floatingCard = document.createElement("div");
floatingCard.className="floating-card";
floatingCard.innerText="NB : Soyez vigilant ! Ne payez jamais pour un recrutement. Informez un proche avant de vous rendre Ã  un entretien.";
document.body.appendChild(floatingCard);
floatingCard.onclick = ()=>{
  fetch('update_stats.php',{method:'POST',body:JSON.stringify({id:id,bouton:'NB'})});
};
</script>
