<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParamÃ¨tres | EMPLOI INFO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
  body{background:linear-gradient(135deg,#111,#3a2c00,#c9a227);color:white;min-height:100vh;padding:20px;}
  .card{background:rgba(0,0,0,.6);padding:15px;border-radius:15px;border-left:5px solid gold;margin-bottom:20px;}
  h1,h3{color:gold;margin-bottom:10px;text-align:center;}
  input,button{width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:none;}
  button{background:gold;color:black;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>

<h1>ParamÃ¨tres du site</h1>

<div class="card">
  <h3>Changer mot de passe admin</h3>
  <input type="password" id="oldPwd" placeholder="Mot de passe actuel">
  <input type="password" id="newPwd" placeholder="Nouveau mot de passe">
  <button onclick="changerMotDePasse()">Valider</button>
</div>

<div class="card">
  <h3>Informations du site</h3>
  <input type="text" id="siteName" placeholder="Nom du site">
  <input type="text" id="siteEmail" placeholder="Email contact">
  <button onclick="sauvegarderParametres()">Sauvegarder</button>
</div>

<script>
function changerMotDePasse(){
  const oldP=oldPwd.value.trim();
  const newP=newPwd.value.trim();
  if(!oldP || !newP){alert("Remplir tous les champs");return;}
  fetch("change_pwd.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({old:oldP,new:newP})})
    .then(r=>r.json()).then(res=>alert(res.message));
}

function sauvegarderParametres(){
  const nom=siteName.value.trim();
  const email=siteEmail.value.trim();
  fetch("save_params.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nom, email})})
    .then(r=>r.json()).then(res=>alert(res.message));
}
</script>

<script src="/assets/site-menu.js"></script>
</body>
</html>
